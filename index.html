<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>荷马史诗 · 闪卡</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border: #e5e7eb;
      --accent: #8b7355;
      --accent-light: #f5f0eb;
      --tag-bg: #f3f4f6;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --radius: 12px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Header ── */
    .header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .header-title span { color: var(--accent); }
    .header-counter {
      font-size: 13px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    /* ── Filter Bar ── */
    .filter-bar {
      padding: 0 20px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .filter-chip.active {
      background: var(--text);
      color: var(--card-bg);
      border-color: var(--text);
    }

    /* ── Card Area ── */
    .card-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 20px;
      perspective: 1200px;
      overflow: hidden;
      position: relative;
    }

    .card-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3 / 5;
      max-height: calc(100dvh - 140px);
      position: relative;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-container.swipe-left { transform: translateX(-120%) rotate(-8deg); opacity: 0; }
    .card-container.swipe-right { transform: translateX(120%) rotate(8deg); opacity: 0; }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .card-face::-webkit-scrollbar { width: 2px; }
    .card-face::-webkit-scrollbar-thumb { background: var(--border); border-radius: 1px; }

    .card-back {
      transform: rotateY(180deg);
    }

    .card-type {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .card-title-cn {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .card-title-en {
      font-size: 15px;
      color: var(--text-secondary);
      font-style: italic;
      margin-bottom: 20px;
    }

    .card-body {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      flex: 1;
    }
    .card-body p { margin-bottom: 12px; }

    .card-anchor {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .card-anchor-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-anchor-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .card-tag {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--tag-bg);
      border-radius: 4px;
      color: var(--text-tertiary);
    }
    .card-portrait {
      width: 100%; max-width: 180px; height: auto; aspect-ratio: 3/4;
      border-radius: 12px;
      object-fit: cover; object-position: center 15%;
      border: 2px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 12px; flex-shrink: 0;
    }
    /* Concept cards: square image, full content visible */
    .card-container.concept-type {
      aspect-ratio: auto;
      max-height: calc(100dvh - 80px);
    }
    .concept-type .card-face {
      overflow-y: visible;
      padding: 24px 22px 16px;
    }
    .card-portrait-concept {
      width: 200px;
      height: 200px;
      border-radius: 10px;
      object-fit: cover;
      object-position: center center;
      margin: 0 auto 12px;
      display: block;
    }
    .concept-type .card-header-row {
      flex-direction: column;
      align-items: stretch;
    }
    .concept-type .card-header-text {
      text-align: left;
    }
    .concept-type .card-header-text .card-title-cn { font-size: 23px; margin-bottom: 3px; }
    .concept-type .card-header-text .card-title-en { font-size: 14px; margin-bottom: 14px; }
    .concept-type .card-body { font-size: 14px; line-height: 1.6; }
    .concept-type .card-anchor-text { font-size: 12px; line-height: 1.5; }
    .concept-type .card-type { margin-bottom: 10px; }
    .card-header-row {
      display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px;
    }
    .card-header-text { text-align: center; }
    .card-header-text .card-title-cn { margin-bottom: 2px; font-size: 24px; }
    .card-header-text .card-title-en { margin-bottom: 0; }


    .flip-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.6;
    }
    .flip-hint svg { width: 14px; height: 14px; }

    /* ── Footer Controls ── */
    .footer {
      padding: 12px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }
    .nav-btn:active { transform: scale(0.92); }
    .nav-btn svg { width: 20px; height: 20px; color: var(--text-secondary); }

    .shuffle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
    }
    .shuffle-btn:active { transform: scale(0.92); }
    .shuffle-btn.active { background: var(--text); border-color: var(--text); }
    .shuffle-btn.active svg { color: var(--card-bg); }
    .shuffle-btn svg { width: 18px; height: 18px; color: var(--text-secondary); }

    .progress-bar {
      flex: 1;
      max-width: 160px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width var(--transition);
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      color: var(--text-tertiary);
      font-size: 15px;
      line-height: 1.6;
    }
    .empty-state-icon { font-size: 40px; margin-bottom: 12px; }

    /* ── Animations ── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-container { animation: slideIn 0.4s ease-out; }

    /* ── Safe area for notched phones ── */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .footer { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>

<script>

const CARDS = [
  {

  {

    typeLabelEn: "Character",
    book: "伊利亚特",
    tags: ["人物"],
    frontBody: `帕里斯（亚历山大）— 特洛伊王子，因选择阿佛洛狄忒为最美女神而获得海伦，直接引发战争。性格矛盾体：虚荣却怯懦，敢在安全距离内挑衅却不敢真打。`,
    backBody: `Paris (Alexandros) — Trojan prince who chose Aphrodite as the fairest goddess and was rewarded with Helen, directly triggering the war. A walking paradox: vain yet cowardly, provocative only from a safe distance.`,

  {
    id: "pandarus",

    titleCn: "潘达罗斯",

    typeLabelCn: "人物",
    typeLabelEn: "Character",
    book: "伊利亚特",
    tags: ["人物", "地缘"],
    frontBody: `潘达罗斯 — 吕基亚弓箭手，被化装为凡人的雅典娜蛊惑，在休战期间射伤墨涅拉俄斯，成为破坏和平的"耗材代理人"。`,
    backBody: `Pandarus — A Lycian archer manipulated by Athena (disguised as a mortal) into shooting Menelaus during a truce, becoming a disposable proxy who shattered the peace.`,

  {

    titleCn: "雅典娜",
    titleEn: "Athena",
    type: "character",
    typeLabelCn: "人物",
    typeLabelEn: "Character",
    book: "伊利亚特",
    tags: ["人物", "神话"],
    frontBody: `雅典娜 — 智慧与战争女神，坚定的"灭特派"。暗中拨偏潘达罗斯射向墨涅拉俄斯的箭（不让他死），同时确保特洛伊方背上"毁约"的罪名。不直接动手，而是操控规则。`,

    typeLabelEn: "Concept",

    tags: ["概念", "神话"],
    frontBody: `金苹果 = 比较陷阱。厄里斯的天才在于：她不需要亲自战斗，只需制造一个"谁是最好的"标准。自我系统（Ego）会自动运行并自我毁灭。这是最高效的破坏——让目标自己消耗自己。`,
    backBody: `The Golden Apple = A Comparison Trap. Eris's genius: she didn't need to fight. She only needed to create a metric of "who is the best" — the Ego would then auto-execute and self-destruct. The most efficient destruction makes the target consume itself.`,

  {

    titleCn: "第一枪的道德红利",

    tags: ["概念", "地缘"],
    frontBody: `第一枪的道德红利 — 雅典娜操控潘达罗斯射出"第一箭"，让希腊方获得"对方毁约"的正义叙事。谁先动手，谁在道义上就输了；而"被打"的一方获得全面反击的合法性。`,

    book: "伊利亚特",
    tags: ["人物"],
    frontBody: `墨涅拉俄斯 — 斯巴达国王，海伦的合法丈夫，阿伽门农的弟弟。在与帕里斯的阵前单挑中展现出压倒性的武力优势（帕里斯"秒怂"），是希腊方发动战争的直接苦主。`,

    book: "伊利亚特",
    tags: ["人物"],
    frontBody: `阿喀琉斯 — 希腊联军中最伟大的英雄。他的"罢工"退出战斗，导致长达十年围城的联军失去了强攻城池的底气与战力，逼迫希腊军方必须同意帕里斯提出的单挑决胜负以"止损"。`,

    typeLabelCn: "人物",

    tags: ["人物", "神话"],
    frontBody: `赫拉 — 天后，主神宙斯的妻子。因为在"金苹果事件"中输给阿佛洛狄忒，从而对特洛伊恨之入骨。她拒绝任何以和平收场的休战协议，是神明中典型的"鹰派"，要求特洛伊城必须彻底毁灭。`,

    typeLabelEn: "Concept",
    book: "伊利亚特",
    tags: ["时间", "概念"],
    frontBody: `第十年 / 十年围城 — 《伊利亚特》故事开篇所处的关键时间节点。长达十年的拉锯战导致希腊联军军心涣散、厌战情绪高涨（甚至出现集体跑路倾向）。这也解释了为何希腊将领轻易同意了帕里斯的单挑止损方案。`,
    backBody: `The Tenth Year (Ten Years of Siege) — The precise timeframe when the Iliad begins. A decade of grinding stalemate drained morale and induced extreme war-weariness (even mass desertion threats) among the Greeks, explaining why their commanders eagerly agreed to the duel to try and end the war swiftly.`,
    anchor: `第十年 = 崩溃临界点 — 无论是大公司拉锯项目还是古代围城，拖到第十年，所有人脑子里都只有一个念头：赶紧止损下班！`

// ═══════════════════════════════════════
// App State
// ═══════════════════════════════════════
let currentIndex = 0;
let filteredCards = [...CARDS];
let isFlipped = false;
let isShuffled = false;
let touchStartX = 0;
let touchStartY = 0;
let isSwiping = false;

// ═══════════════════════════════════════
// DOM Elements
// ═══════════════════════════════════════
const cardContainer = document.getElementById('cardContainer');
const cardFront = document.getElementById('cardFront');
const cardBack = document.getElementById('cardBack');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const filterBar = document.getElementById('filterBar');
const cardArea = document.getElementById('cardArea');

// ═══════════════════════════════════════
// Render
// ═══════════════════════════════════════
function renderCard(card) {
  // Front (Chinese)
  const imgClass = card.type === "concept" ? "card-portrait card-portrait-concept" : "card-portrait";
  const pHtml = card.image ? `<div class="card-header-row"><img class="${imgClass}" src="${card.image}" alt="${card.titleCn}" loading="lazy"><div class="card-header-text"><div class="card-title-cn">${card.titleCn}</div><div class="card-title-en">${card.titleEn}</div></div></div>` : `<div class="card-title-cn">${card.titleCn}</div><div class="card-title-en">${card.titleEn}</div>`;
  cardFront.innerHTML = `
    <div class="card-type">${card.typeLabelCn} · ${card.book}</div>
    ${pHtml}
    <div class="card-body"><p>${card.frontBody}</p></div>
    <div class="card-anchor">
      <div class="card-anchor-label">💡 记忆锚点</div>
      <div class="card-anchor-text">${card.anchor}</div>
    </div>
    <div class="card-tags">${card.tags.map(t => `<span class="card-tag">#${t}</span>`).join('')}</div>
    <div class="flip-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-9L21 12m0 0l-4.5 4.5M21 12H7.5"/></svg>
      点击翻转
    </div>
  `;

  // Back (English)
  cardBack.innerHTML = `
    <div class="card-type">${card.typeLabelEn} · Iliad</div>
    ${pHtml}
    <div class="card-body"><p>${card.backBody}</p></div>
    <div class="card-anchor">
      <div class="card-anchor-label">💡 Memory Anchor</div>
      <div class="card-anchor-text">${card.anchor}</div>
    </div>
    <div class="card-tags">${card.tags.map(t => `<span class="card-tag">#${t}</span>`).join('')}</div>
    <div class="flip-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-9L21 12m0 0l-4.5 4.5M21 12H7.5"/></svg>
      Tap to flip
    </div>
  `;
}

function updateUI() {
  if (filteredCards.length === 0) {
    cardArea.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🏛️</div>当前筛选无结果<br>试试其他标签</div>`;
    counter.textContent = '0 / 0';
    progressFill.style.width = '0%';
    return;
  }

  // Restore card area if it was replaced by empty state
  if (!document.getElementById('cardContainer')) {
    cardArea.innerHTML = `
      <div class="card-container" id="cardContainer">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front" id="cardFront"></div>
          <div class="card-face card-back" id="cardBack"></div>
        </div>
      </div>`;
    // Re-bind references
    Object.assign(window, {
      cardContainer: document.getElementById('cardContainer'),
      cardFront: document.getElementById('cardFront'),
      cardBack: document.getElementById('cardBack')
    });
    bindCardTouch();
  }

  const card = filteredCards[currentIndex];
  renderCard(card);
  counter.textContent = `${currentIndex + 1} / ${filteredCards.length}`;
  progressFill.style.width = `${((currentIndex + 1) / filteredCards.length) * 100}%`;

  // Toggle concept-type class for square image layout
  const container = document.getElementById('cardContainer');
  if (card.type === 'concept') {
    container.classList.add('concept-type');
  } else {
    container.classList.remove('concept-type');
  }

  // Reset flip
  isFlipped = false;
  container.classList.remove('flipped');
}

// ═══════════════════════════════════════
// Navigation
// ═══════════════════════════════════════
function goNext() {
  if (filteredCards.length === 0) return;
  const container = document.getElementById('cardContainer');
  container.classList.add('swipe-left');
  setTimeout(() => {
    currentIndex = (currentIndex + 1) % filteredCards.length;
    container.style.transition = 'none';
    container.classList.remove('swipe-left');
    updateUI();
    void container.offsetHeight;
    container.style.transition = '';
  }, 400);
}

function goPrev() {
  if (filteredCards.length === 0) return;
  const container = document.getElementById('cardContainer');
  container.classList.add('swipe-right');
  setTimeout(() => {
    currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
    container.style.transition = 'none';
    container.classList.remove('swipe-right');
    updateUI();
    void container.offsetHeight;
    container.style.transition = '';
  }, 400);
}

function toggleFlip() {
  const container = document.getElementById('cardContainer');
  if (!container) return;
  isFlipped = !isFlipped;
  container.classList.toggle('flipped', isFlipped);
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  shuffleBtn.classList.toggle('active', isShuffled);
  if (isShuffled) {
    filteredCards = [...filteredCards].sort(() => Math.random() - 0.5);
  } else {
    applyFilter(document.querySelector('.filter-chip.active')?.dataset.filter || 'all');
  }
  currentIndex = 0;
  updateUI();
}

// ═══════════════════════════════════════
// Filters
// ═══════════════════════════════════════
function applyFilter(filter) {
  if (filter === 'all') {
    filteredCards = [...CARDS];
  } else if (filter === 'character' || filter === 'concept') {
    filteredCards = CARDS.filter(c => c.type === filter);
  } else {
    filteredCards = CARDS.filter(c => c.book === filter);
  }
  if (isShuffled) {
    filteredCards.sort(() => Math.random() - 0.5);
  }
  currentIndex = 0;
  updateUI();
}

// ═══════════════════════════════════════
// Touch / Click Handlers
// ═══════════════════════════════════════
function bindCardTouch() {
  const area = document.getElementById('cardArea');
  let touchHandled = false;
  let touchStartTime = 0;

  area.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
    isSwiping = false;
  }, { passive: true });

  area.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      isSwiping = true;
    }
    // Detect vertical scroll intent — if user moves finger > 8px vertically,
    // mark as scrolling so touchend won't flip
    if (Math.abs(dy) > 8) {
      touchHandled = true; // suppress flip
    }
  }, { passive: true });

  area.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    const moveDist = Math.sqrt(dx*dx + dy*dy);

    if (isSwiping && Math.abs(dx) > 50) {
      // Horizontal swipe → navigate
      dx < 0 ? goNext() : goPrev();
      touchHandled = true;
    } else if (moveDist < 10 && dt < 300 && !touchHandled) {
      // Clean tap (minimal movement, fast) → flip
      toggleFlip();
      touchHandled = true;
    }
    // Otherwise: user was scrolling vertically → do nothing, let native scroll happen

    isSwiping = false;
    setTimeout(() => { touchHandled = false; }, 400);
  });

  area.addEventListener('click', (e) => {
    // Skip if touch already handled (prevents ghost click double-toggle)
    if (touchHandled) return;
    toggleFlip();
  });
}

// ═══════════════════════════════════════
// Keyboard
// ═══════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goPrev();
  else if (e.key === 'ArrowRight') goNext();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleFlip(); }
});

// ═══════════════════════════════════════
// Event Binding
// ═══════════════════════════════════════
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
shuffleBtn.addEventListener('click', toggleShuffle);

filterBar.addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  filterBar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  applyFilter(chip.dataset.filter);
});

// ═══════════════════════════════════════
// Init
// ═══════════════════════════════════════
bindCardTouch();
updateUI();
</script>
